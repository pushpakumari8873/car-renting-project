<div class="row mt-3">
    <div class="col-8">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header bg-white py-3 border-0">
                <div class="row align-items-center">
                    <div class="col">
                        <h5 class="mb-0 fw-bold text-dark">Vehicle List</h5>
                    </div>
                    <div class="col-auto">
                        <button class="btn btn-outline-primary btn-sm rounded-pill">
                            <i class="fa fa-refresh me-1"></i> Refresh
                        </button>
                    </div>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                            <tr class="small text-uppercase text-muted">
                                <th class="ps-4">#</th>
                                <th>Brand-Model</th>
                                <th>Reg #</th>
                                <th>Year</th>
                                <th>Daily Rate</th>
                                <th class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody>

                            @for(item of carList; track $index){

                            <tr>
                                <td class="ps-4">{{$index+1}}</td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=200"
                                            class="rounded me-2" width="40" height="40">
                                        <div>
                                            <div class="fw-bold">{{item.brand}}</div>
                                            <div class="small text-muted">{{item.model}}</div>
                                        </div>
                                    </div>
                                </td>
                                <td><span class="badge bg-light text-dark border">{{item.regNo}}</span></td>
                                <td>{{item.year}}</td>
                                <td><span class="text-success fw-bold">{{item.dailyRate}}</span></td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-info border-0 rounded-circle me-1">
                                        <i class="fa fa-pencil" (click)="onEditCar(item)"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger border-0 rounded-circle">
                                        <i class="fa fa-trash" (click)="onDeleteCar(item.carId)"></i>
                                    </button>
                                </td>
                            </tr>
                            }


                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div class="col-4">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header bg-white py-3 border-0">
                <h5 class="mb-0 fw-bold text-dark">Manage Vehicle</h5>
            </div>
            <div class="card-body">
                <form>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label fw-semibold small">Brand</label>
                            <input type="text" class="form-control form-control-sm rounded-3"
                                [(ngModel)]="newCarObj.brand" name="brand" placeholder="e.g. Toyota">
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label fw-semibold small">Model</label>
                            <input type="text" class="form-control form-control-sm rounded-3" name="model"
                                [(ngModel)]="newCarObj.model" placeholder="e.g. Fortuner">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label fw-semibold small">Year</label>
                            <input type="number" class="form-control form-control-sm rounded-3" name="year"
                                [(ngModel)]="newCarObj.year">
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label fw-semibold small">Color</label>
                            <input type="text" class="form-control form-control-sm rounded-3" name="color"
                                [(ngModel)]="newCarObj.color" placeholder="e.g. White">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label fw-semibold small">Daily Rate</label>
                            <input type="number" class="form-control form-control-sm rounded-3" name="dailyRate"
                                [(ngModel)]="newCarObj.dailyRate" placeholder="0.00">
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label fw-semibold small">Registration Number</label>
                            <input type="text" class="form-control form-control-sm rounded-3" name="regNo"
                                [(ngModel)]="newCarObj.regNo" placeholder="MH 12 AB 1234">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Car Image URL</label>
                        <input type="text" class="form-control form-control-sm rounded-3" name="carImage"
                            [(ngModel)]="newCarObj.carImage" placeholder="https://...">
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <button class="btn btn-light btn-sm rounded-pill px-3 border" type="button"
                            (click)="newCarObj = {carId: 0, brand: '', model: '', year: 0, color: '', dailyRate: 0, carImage: '', regNo: ''}">Reset</button>
                        @if(newCarObj.carId == 0){

                        <button class="btn btn-primary btn-sm rounded-pill px-4 shadow-sm" type="button"
                            (click)="onSaveCar()">Save Vehicle</button>
                        }
                        @else {
                        <button class="btn btn-primary btn-sm rounded-pill px-4 shadow-sm" type="button"
                            (click)="onUpdateCar()">Update Vehicle</button>
                        }

                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
