<div class="login-container">
    <div class="login-card shadow">
        <div class="text-center mb-4">
            <i class="fa fa-car fa-3x text-primary mb-3"></i>
            <h2 class="fw-bold text-dark">Car Rental Admin</h2>
            <p class="text-muted">Welcome back! Please login to your account.</p>
        </div>
        <form>
            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="fa fa-user text-muted"></i>
                    </span>
                    <input type="text" [(ngModel)]="loginObj.userName" name="userName"
                        class="form-control border-start-0 bg-light" placeholder="Enter username">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="fa fa-lock text-muted"></i>
                    </span>
                    <input type="password" [(ngModel)]="loginObj.password" name="password"
                        class="form-control border-start-0 bg-light" placeholder="Enter password">
                </div>
            </div>
            <button type="button" (click)="onLogin()" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                LOG IN <i class="fa fa-sign-in ms-1"></i>
            </button>
        </form>
        <div class="text-center mt-4">
            <small class="text-muted">Demo UI - Click Login to Continue</small>
        </div>
    </div>
</div>
